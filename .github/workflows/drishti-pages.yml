# Builds the aushadhi-drishti map (drishti/ folder), checks it in a headless
# browser at 360 px and 1280 px, and publishes it to GitHub Pages.
# Every Monday it also re-fetches all open sources (weekly refresh).
name: drishti pages

on:
  push:
    branches: [main]
    paths: ["drishti/**", ".github/workflows/drishti-pages.yml"]
  schedule:
    - cron: "23 2 * * 1"   # Mondays 02:23 UTC (07:53 in India)
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch every source now"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: drishti-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drishti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drishti/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep downloads and geocoder answers between runs
        uses: actions/cache@v4
        with:
          path: drishti/pipeline/.cache
          key: drishti-data-${{ github.run_id }}
          restore-keys: drishti-data-
      - name: Data build (offline tests, then fetch and build)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install -r pipeline/requirements.txt
          python -m unittest discover tests
          node --test tests/ask.test.mjs
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            python pipeline/build.py --refresh
          else
            python pipeline/build.py
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            python pipeline/world.py --refresh
          else
            python pipeline/world.py
          fi
      - name: Upload data notes (which sources worked)
        uses: actions/upload-artifact@v4
        with:
          name: data-meta
          path: drishti/public/data/meta.json
      - run: npm ci
      - run: npm run build
      - name: Browser check (360 px and 1280 px, no console errors)
        run: |
          pip install playwright==1.50.0
          python -m playwright install --with-deps chromium
          python tests/browser_check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: drishti/dist
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: drishti/docs/images

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
